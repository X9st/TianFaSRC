            operationId: listUsers
            parameters:
                - in: query
                  name: cursor
                  schema:
                    format: uuid
                    type: string
                - in: query
                  name: limit
                  schema:
                    default: 30
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        items:
                                            $ref: '#/components/schemas/User'
                                        type: array
                                    meta:
                                        properties:
                                            request_id:
                                                type: string
                                        required:
                                            - request_id
                                        type: object
                                required:
                                    - data
                                    - meta
                                type: object
                    description: 成功
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: 错误
