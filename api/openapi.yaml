components:
    schemas:
        Activity:
            properties:
                event_id:
                    format: uuid
                    type: string
                id:
                    format: uuid
                    type: string
                kind:
                    type: string
                occurred_at:
                    format: date-time
                    type: string
                summary:
                    type: string
                task_id:
                    format: uuid
                    type: string
            required:
                - id
                - event_id
                - task_id
                - kind
                - summary
                - occurred_at
            type: object
        AgentPrompt:
            properties:
                body:
                    type: string
                content_hash:
                    type: string
                role:
                    type: string
                version:
                    type: integer
            required:
                - role
                - version
                - body
                - content_hash
            type: object
        AgentRun:
            properties:
                error_class:
                    type: string
                id:
                    format: uuid
                    type: string
                intent_id:
                    format: uuid
                    type: string
                prompt_hash:
                    type: string
                prompt_version:
                    type: integer
                role:
                    type: string
                started_at:
                    format: date-time
                    type: string
                status:
                    type: string
                task_id:
                    format: uuid
                    type: string
            required:
                - id
                - task_id
                - role
                - status
                - prompt_version
                - prompt_hash
            type: object
        AgentRunDetail:
            properties:
                attempts:
                    items:
                        properties:
                            error_class:
                                type: string
                            estimated:
                                type: boolean
                            input_tokens:
                                type: integer
                            ordinal:
                                type: integer
                            output_tokens:
                                type: integer
                            profile_id:
                                format: uuid
                                type: string
                            status:
                                type: string
                        required:
                            - profile_id
                            - ordinal
                            - status
                        type: object
                    type: array
                messages:
                    items:
                        properties:
                            content:
                                type: string
                            ordinal:
                                type: integer
                            role:
                                type: string
                            trust_level:
                                type: string
                        required:
                            - ordinal
                            - role
                            - trust_level
                            - content
                        type: object
                    type: array
                run:
                    $ref: '#/components/schemas/AgentRun'
            required:
                - run
                - messages
                - attempts
            type: object
        Asset:
            properties:
                attributes:
                    additionalProperties: true
                    type: object
                canonical_key:
                    type: string
                confidence:
                    type: number
                display_value:
                    type: string
                first_seen_at:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                kind:
                    type: string
                last_seen_at:
                    format: date-time
                    type: string
                organization_id:
                    format: uuid
                    type: string
                parent_id:
                    format: uuid
                    type: string
                raw_value:
                    type: string
                source_task_id:
                    format: uuid
                    type: string
            required:
                - id
                - organization_id
                - kind
                - canonical_key
                - display_value
            type: object
        CVSS:
            properties:
                score:
                    type: number
                vector:
                    type: string
                version:
                    type: string
            required:
                - version
                - vector
                - score
            type: object
        Constraint:
            properties:
                effect:
                    type: string
                id:
                    format: uuid
                    type: string
                source:
                    type: string
                text:
                    type: string
            required:
                - effect
                - text
            type: object
        Coverage:
            properties:
                anchored_assets:
                    type: integer
                asset_count:
                    type: integer
                goal_count:
                    type: integer
                proven_goal_count:
                    type: integer
            required:
                - asset_count
                - anchored_assets
                - goal_count
                - proven_goal_count
            type: object
        CreateTaskRequest:
            properties:
                constraints:
                    items:
                        $ref: '#/components/schemas/Constraint'
                    type: array
                description:
                    type: string
                execution:
                    properties:
                        deadline_at:
                            format: date-time
                            type:
                                - string
                                - "null"
                        policy_mode:
                            type: string
                        worker_limit:
                            type: integer
                    required: []
                    type: object
                goals:
                    items:
                        $ref: '#/components/schemas/Goal'
                    type: array
                llm_profile_chain:
                    items:
                        format: uuid
                        type: string
                    type: array
                scope:
                    properties:
                        entries:
                            items:
                                $ref: '#/components/schemas/ScopeEntry'
                            type: array
                    required:
                        - entries
                    type: object
                title:
                    type: string
            required:
                - title
                - goals
                - scope
            type: object
        CredentialWrite:
            properties:
                remove:
                    type: boolean
                secret_value:
                    type: string
                    writeOnly: true
            required: []
            type: object
        CustomHTTPTool:
            properties:
                description:
                    type: string
                enabled:
                    type: boolean
                id:
                    format: uuid
                    type: string
                input_schema:
                    properties: {}
                    required: []
                    type: object
                method:
                    type: string
                name:
                    type: string
                url_template:
                    type: string
            required:
                - id
                - name
                - url_template
                - method
                - input_schema
                - enabled
            type: object
        Evidence:
            properties:
                binding_id:
                    format: uuid
                    type: string
                captured_at:
                    format: date-time
                    type: string
                finding_id:
                    format: uuid
                    type: string
                metadata:
                    properties: {}
                    required: []
                    type: object
                note:
                    type: string
                position:
                    type: integer
                request_headers:
                    properties: {}
                    required: []
                    type: object
                request_sha256:
                    type: string
                response_headers:
                    properties: {}
                    required: []
                    type: object
                response_sha256:
                    type: string
                role:
                    type: string
                snapshot_id:
                    format: uuid
                    type: string
            required:
                - binding_id
                - finding_id
                - snapshot_id
                - role
                - note
                - position
                - metadata
                - captured_at
            type: object
        Finding:
            properties:
                asset_ids:
                    items:
                        format: uuid
                        type: string
                    type: array
                created_at:
                    format: date-time
                    type: string
                cvss:
                    $ref: '#/components/schemas/CVSS'
                evidence_version:
                    type: integer
                fingerprint:
                    type: string
                id:
                    format: uuid
                    type: string
                impact:
                    type: string
                location:
                    type: string
                node_id:
                    format: uuid
                    type: string
                observed_result:
                    type: string
                preconditions:
                    type: string
                recommendation:
                    type: string
                report_evidence_version:
                    type: integer
                reproduction_steps:
                    items:
                        type: string
                    type: array
                severity:
                    type: string
                source_intent_id:
                    format: uuid
                    type: string
                status:
                    type: string
                task_id:
                    format: uuid
                    type: string
                title:
                    type: string
                updated_at:
                    format: date-time
                    type: string
                version:
                    type: integer
                vulnerability_type:
                    type: string
            required:
                - id
                - task_id
                - node_id
                - fingerprint
                - title
                - vulnerability_type
                - location
                - severity
                - status
                - asset_ids
                - evidence_version
                - version
            type: object
        Goal:
            properties:
                id:
                    format: uuid
                    type: string
                priority:
                    type: integer
                state:
                    type: string
                text:
                    type: string
            required:
                - text
                - priority
            type: object
        Graph:
            properties:
                anchors:
                    items:
                        properties:
                            asset_id:
                                format: uuid
                                type: string
                            asset_kind:
                                type: string
                            asset_value:
                                type: string
                            node_id:
                                format: uuid
                                type: string
                        required:
                            - node_id
                            - asset_id
                            - asset_kind
                            - asset_value
                        type: object
                    type: array
                edges:
                    items:
                        properties:
                            from_node_id:
                                format: uuid
                                type: string
                            kind:
                                type: string
                            to_node_id:
                                format: uuid
                                type: string
                        required:
                            - from_node_id
                            - to_node_id
                            - kind
                        type: object
                    type: array
                nodes:
                    items:
                        $ref: '#/components/schemas/Node'
                    type: array
            required:
                - nodes
                - edges
                - anchors
            type: object
        HealthCheck:
            properties:
                detail:
                    type: string
                status:
                    enum:
                        - up
                        - down
                    type: string
            required:
                - status
            type: object
        HealthResponse:
            properties:
                checks:
                    additionalProperties:
                        $ref: '#/components/schemas/HealthCheck'
                    type: object
                service:
                    const: tianfa-server
                    type: string
                status:
                    enum:
                        - ok
                        - not_ready
                    type: string
                version:
                    type: string
            required:
                - status
                - service
                - version
                - checks
            type: object
        Intent:
            properties:
                attempt:
                    type: integer
                blocking_reason:
                    type:
                        - string
                        - "null"
                goal_id:
                    format: uuid
                    type: string
                id:
                    format: uuid
                    type: string
                objective:
                    type: string
                priority:
                    type: integer
                status:
                    type: string
                stop_reason:
                    type:
                        - string
                        - "null"
                success_criteria:
                    type: string
            required:
                - id
                - goal_id
                - objective
                - success_criteria
                - status
            type: object
        LLMChain:
            properties:
                profiles:
                    items:
                        format: uuid
                        type: string
                    type: array
            required:
                - profiles
            type: object
        LLMProfile:
            properties:
                base_url:
                    type: string
                circuit_state:
                    enum:
                        - closed
                        - open
                        - half_open
                    type: string
                context_window:
                    type: integer
                cooldown_until:
                    format: date-time
                    type:
                        - string
                        - "null"
                credential_hint:
                    type:
                        - string
                        - "null"
                credential_ref:
                    format: uuid
                    type:
                        - string
                        - "null"
                enabled:
                    type: boolean
                format:
                    enum:
                        - openai-chat
                        - openai-responses
                        - anthropic
                    type: string
                health_state:
                    type: string
                id:
                    format: uuid
                    type: string
                max_output_tokens:
                    type: integer
                model:
                    type: string
                name:
                    type: string
                priority:
                    type: integer
                rate_per_minute:
                    type: integer
                rate_per_second:
                    type: integer
                stream:
                    type: boolean
            required:
                - id
                - name
                - format
                - base_url
                - model
                - enabled
            type: object
        LLMProfilePatch:
            properties:
                base_url:
                    type: string
                context_window:
                    type: integer
                credential:
                    $ref: '#/components/schemas/CredentialWrite'
                enabled:
                    type: boolean
                format:
                    type: string
                max_output_tokens:
                    type: integer
                model:
                    type: string
                name:
                    type: string
                priority:
                    type: integer
                rate_per_minute:
                    type: integer
                rate_per_second:
                    type: integer
                reasoning_effort:
                    type: string
                retry_policy:
                    additionalProperties: true
                    type: object
                session_header_name:
                    type: string
                stream:
                    type: boolean
                thinking_mode:
                    type: string
            required: []
            type: object
        LLMProfileWrite:
            properties:
                base_url:
                    type: string
                context_window:
                    type: integer
                credential:
                    $ref: '#/components/schemas/CredentialWrite'
                enabled:
                    type: boolean
                format:
                    type: string
                max_output_tokens:
                    type: integer
                model:
                    type: string
                name:
                    type: string
                priority:
                    type: integer
                rate_per_minute:
                    type: integer
                rate_per_second:
                    type: integer
                reasoning_effort:
                    type: string
                retry_policy:
                    additionalProperties: true
                    type: object
                session_header_name:
                    type: string
                stream:
                    type: boolean
                thinking_mode:
                    type: string
            required:
                - name
                - format
                - base_url
                - model
                - context_window
                - max_output_tokens
                - rate_per_second
                - rate_per_minute
            type: object
        MCPServer:
            properties:
                args:
                    items:
                        type: string
                    type: array
                command:
                    type: string
                enabled:
                    type: boolean
                endpoint:
                    type: string
                id:
                    format: uuid
                    type: string
                name:
                    type: string
                transport:
                    type: string
            required:
                - id
                - name
                - transport
                - enabled
            type: object
        MCPTool:
            properties:
                description:
                    type: string
                enabled:
                    type: boolean
                input_schema:
                    properties: {}
                    required: []
                    type: object
                name:
                    type: string
                schema_hash:
                    type: string
            required:
                - name
                - description
                - input_schema
                - schema_hash
                - enabled
            type: object
        Node:
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                kind:
                    type: string
                run_id:
                    format: uuid
                    type: string
                source_intent_id:
                    format: uuid
                    type: string
                state:
                    type: string
                summary:
                    type: string
                tool_call_id:
                    format: uuid
                    type: string
            required:
                - id
                - kind
                - state
                - summary
            type: object
        Problem:
            properties:
                detail:
                    type: string
                instance:
                    type: string
                request_id:
                    type: string
                status:
                    type: integer
                title:
                    type: string
                type:
                    format: uri
                    type: string
            required:
                - type
                - title
                - status
                - request_id
            type: object
        ProxyToken:
            properties:
                expires_at:
                    format: date-time
                    type: string
                task_id:
                    format: uuid
                    type: string
                token:
                    type: string
            required:
                - token
                - task_id
                - expires_at
            type: object
        Report:
            properties:
                body:
                    type: string
                current_evidence_version:
                    type: integer
                evidence_version:
                    type: integer
                stale:
                    type: boolean
                task_id:
                    format: uuid
                    type: string
                updated_at:
                    format: date-time
                    type: string
                version:
                    type: integer
            required:
                - task_id
                - body
                - version
                - evidence_version
                - current_evidence_version
                - stale
            type: object
        Retest:
            properties:
                completed_at:
                    format: date-time
                    type: string
                conclusion:
                    type: string
                created_at:
                    format: date-time
                    type: string
                evidence_version:
                    type: integer
                finding_id:
                    format: uuid
                    type: string
                id:
                    format: uuid
                    type: string
                note:
                    type: string
                scope_version:
                    type: integer
                status:
                    type: string
                task_id:
                    format: uuid
                    type: string
            required:
                - id
                - finding_id
                - task_id
                - evidence_version
                - scope_version
                - status
                - created_at
            type: object
        ScopeEntry:
            properties:
                effect:
                    enum:
                        - allow
                        - deny
                    type: string
                id:
                    format: uuid
                    type: string
                kind:
                    enum:
                        - domain
                        - ip
                        - cidr
                        - url_prefix
                        - service
                    type: string
                normalized_value:
                    type: string
                path_prefix:
                    type: string
                ports:
                    items:
                        type: integer
                    type: array
                value:
                    type: string
            required:
                - effect
                - kind
                - value
                - ports
            type: object
        Skill:
            properties:
                content_hash:
                    type: string
                enabled:
                    type: boolean
                id:
                    format: uuid
                    type: string
                manifest:
                    properties:
                        agents:
                            items:
                                type: string
                            type: array
                        capabilities:
                            items:
                                type: string
                            type: array
                        description:
                            type: string
                        mcps:
                            items:
                                type: string
                            type: array
                        name:
                            type: string
                        version:
                            type: string
                    required:
                        - name
                        - version
                        - description
                    type: object
            required:
                - id
                - manifest
                - content_hash
                - enabled
            type: object
        Task:
            properties:
                created_at:
                    format: date-time
                    type: string
                created_by:
                    format: uuid
                    type: string
                deadline_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                description:
                    type: string
                id:
                    format: uuid
                    type: string
                organization_id:
                    format: uuid
                    type: string
                policy_mode:
                    type: string
                scope_version:
                    type: integer
                status:
                    type: string
                title:
                    type: string
                updated_at:
                    format: date-time
                    type: string
                version:
                    type: integer
                worker_limit:
                    type: integer
            required:
                - id
                - organization_id
                - title
                - status
                - version
                - scope_version
            type: object
        TaskDetail:
            properties:
                constraints:
                    items:
                        $ref: '#/components/schemas/Constraint'
                    type: array
                goals:
                    items:
                        $ref: '#/components/schemas/Goal'
                    type: array
                scope:
                    items:
                        $ref: '#/components/schemas/ScopeEntry'
                    type: array
                task:
                    $ref: '#/components/schemas/Task'
            required:
                - task
                - goals
                - constraints
                - scope
            type: object
        Todo:
            properties:
                created_at:
                    format: date-time
                    type: string
                depends_on:
                    items:
                        format: uuid
                        type: string
                    type: array
                detail:
                    type: string
                id:
                    format: uuid
                    type: string
                intent_id:
                    format: uuid
                    type: string
                status:
                    type: string
                title:
                    type: string
            required:
                - id
                - title
                - status
                - depends_on
                - created_at
            type: object
        TodoWrite:
            properties:
                depends_on:
                    items:
                        format: uuid
                        type: string
                    type: array
                detail:
                    type: string
                title:
                    type: string
            required:
                - title
            type: object
        ToolApproval:
            properties:
                decided_at:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                reason:
                    type: string
                requested_at:
                    format: date-time
                    type: string
                status:
                    type: string
                task_id:
                    format: uuid
                    type: string
                tool_call_id:
                    format: uuid
                    type: string
                tool_name:
                    type: string
            required:
                - id
                - tool_call_id
                - task_id
                - tool_name
                - status
                - requested_at
            type: object
        ToolCall:
            properties:
                completed_at:
                    format: date-time
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                input:
                    properties: {}
                    required: []
                    type: object
                intent_id:
                    format: uuid
                    type: string
                name:
                    type: string
                output:
                    properties: {}
                    required: []
                    type: object
                policy_reason:
                    type: string
                run_id:
                    format: uuid
                    type: string
                scope_version:
                    type: integer
                status:
                    type: string
                summary:
                    type: string
                task_id:
                    format: uuid
                    type: string
            required:
                - id
                - task_id
                - intent_id
                - run_id
                - name
                - input
                - status
                - scope_version
                - created_at
            type: object
        TraceHit:
            properties:
                created_at:
                    format: date-time
                    type: string
                excerpt:
                    type: string
                intent_id:
                    format: uuid
                    type: string
                ordinal:
                    type: integer
                role:
                    type: string
                run_id:
                    format: uuid
                    type: string
            required:
                - run_id
                - intent_id
                - ordinal
                - role
                - excerpt
                - created_at
            type: object
        Traffic:
            properties:
                host:
                    type: string
                id:
                    format: uuid
                    type: string
                intent_id:
                    format: uuid
                    type: string
                method:
                    type: string
                path:
                    type: string
                remote_ip:
                    type: string
                request_body_bytes:
                    type: integer
                request_body_sha256:
                    type: string
                request_bytes:
                    type: integer
                request_headers:
                    properties: {}
                    required: []
                    type: object
                request_sha256:
                    type: string
                requested_at:
                    format: date-time
                    type: string
                responded_at:
                    format: date-time
                    type: string
                response_body_bytes:
                    type: integer
                response_body_sha256:
                    type: string
                response_bytes:
                    type: integer
                response_headers:
                    properties: {}
                    required: []
                    type: object
                response_sha256:
                    type: string
                run_id:
                    format: uuid
                    type: string
                status_code:
                    type: integer
                task_id:
                    format: uuid
                    type: string
                tls:
                    properties: {}
                    required: []
                    type: object
                tool_call_id:
                    format: uuid
                    type: string
                url:
                    type: string
            required:
                - id
                - task_id
                - method
                - url
                - host
                - path
                - status_code
                - remote_ip
                - request_bytes
                - response_bytes
                - requested_at
            type: object
        User:
            properties:
                created_at:
                    format: date-time
                    type: string
                email:
                    format: email
                    type: string
                id:
                    format: uuid
                    type: string
                organization_id:
                    format: uuid
                    type: string
                role:
                    enum:
                        - admin
                        - operator
                        - reviewer
                        - viewer
                    type: string
                status:
                    type: string
            required:
                - id
                - organization_id
                - email
                - role
                - status
            type: object
    securitySchemes:
        SessionCookie:
            in: cookie
            name: tianfa_session
            type: apiKey
info:
    description: 授权安全验证平台 API。当前文档覆盖 Phase 0 至 Phase 5。
    title: TianFa API
    version: 0.1.0
openapi: 3.1.0
paths:
    /api/v1/agent-prompts/{role}:
        get:
            operationId: getAgentPrompt
            parameters:
                - in: path
                  name: role
                  required: true
                  schema:
                    enum:
                        - decomposer
                        - planner
                        - worker
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/AgentPrompt'
                                    meta:
                                        properties:
                                            request_id:
                                                type: string
                                        required:
                                            - request_id
                                        type: object
                                required:
                                    - data
                                    - meta
                                type: object
                    description: 成功
                "400":
                    content:
