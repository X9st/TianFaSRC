                                                type: string
                                        required:
                                            - request_id
                                        type: object
                                required:
                                    - data
                                    - meta
                                type: object
                    description: 成功
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: 错误
                "401":
                    content:
                        application/problem+json:
