components:
    schemas:
        Activity:
            properties:
                event_id:
                    format: uuid
                    type: string
                id:
                    format: uuid
                    type: string
                kind:
                    type: string
                occurred_at:
                    format: date-time
                    type: string
                summary:
                    type: string
                task_id:
                    format: uuid
                    type: string
            required:
                - id
                - event_id
                - task_id
                - kind
                - summary
                - occurred_at
            type: object
        Asset:
            properties:
                attributes:
                    additionalProperties: true
                    type: object
                canonical_key:
                    type: string
                confidence:
                    type: number
                display_value:
                    type: string
                first_seen_at:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                kind:
                    type: string
                last_seen_at:
                    format: date-time
                    type: string
                organization_id:
                    format: uuid
                    type: string
                parent_id:
                    format: uuid
                    type: string
                raw_value:
                    type: string
                source_task_id:
                    format: uuid
                    type: string
            required:
                - id
                - organization_id
                - kind
                - canonical_key
                - display_value
            type: object
        Constraint:
            properties:
                effect:
                    type: string
                id:
                    format: uuid
                    type: string
                source:
                    type: string
                text:
                    type: string
            required:
                - effect
                - text
            type: object
        Coverage:
            properties:
                anchored_assets:
                    type: integer
                asset_count:
                    type: integer
                goal_count:
                    type: integer
                proven_goal_count:
                    type: integer
            required:
                - asset_count
                - anchored_assets
                - goal_count
                - proven_goal_count
            type: object
        CreateTaskRequest:
            properties:
                constraints:
                    items:
                        $ref: '#/components/schemas/Constraint'
                    type: array
                description:
                    type: string
                execution:
                    properties:
                        budget:
                            additionalProperties: true
                            type: object
                        deadline_at:
                            format: date-time
                            type:
                                - string
                                - "null"
                        policy_mode:
                            type: string
                        worker_limit:
                            type: integer
                    required: []
                    type: object
                goals:
                    items:
                        $ref: '#/components/schemas/Goal'
                    type: array
                llm_profile_chain:
                    items:
                        format: uuid
                        type: string
                    type: array
                scope:
                    properties:
                        entries:
                            items:
                                $ref: '#/components/schemas/ScopeEntry'
                            type: array
                    required:
                        - entries
                    type: object
                title:
                    type: string
            required:
                - title
                - goals
                - scope
            type: object
        Goal:
            properties:
                id:
                    format: uuid
                    type: string
                priority:
                    type: integer
                state:
                    type: string
                text:
                    type: string
            required:
                - text
                - priority
            type: object
        Graph:
            properties:
                anchors:
                    items:
                        properties:
                            asset_id:
                                format: uuid
                                type: string
                            asset_kind:
                                type: string
                            asset_value:
                                type: string
                            node_id:
                                format: uuid
                                type: string
                        required:
                            - node_id
                            - asset_id
                            - asset_kind
                            - asset_value
                        type: object
                    type: array
                edges:
                    items:
                        properties:
                            from_node_id:
                                format: uuid
                                type: string
                            kind:
                                type: string
                            to_node_id:
                                format: uuid
                                type: string
                        required:
                            - from_node_id
                            - to_node_id
                            - kind
                        type: object
                    type: array
                nodes:
                    items:
                        $ref: '#/components/schemas/Node'
                    type: array
            required:
                - nodes
                - edges
                - anchors
            type: object
        HealthCheck:
            properties:
                detail:
                    type: string
                status:
                    enum:
                        - up
                        - down
                    type: string
            required:
                - status
            type: object
        HealthResponse:
            properties:
                checks:
                    additionalProperties:
                        $ref: '#/components/schemas/HealthCheck'
                    type: object
                service:
                    const: tianfa-server
                    type: string
                status:
                    enum:
                        - ok
                        - not_ready
                    type: string
                version:
                    type: string
            required:
                - status
                - service
                - version
                - checks
            type: object
        Node:
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                kind:
                    type: string
                run_id:
                    format: uuid
                    type: string
                source_intent_id:
                    format: uuid
                    type: string
                state:
                    type: string
                summary:
                    type: string
                tool_call_id:
                    format: uuid
                    type: string
            required:
                - id
                - kind
                - state
                - summary
            type: object
        Problem:
            properties:
                detail:
                    type: string
                instance:
                    type: string
                request_id:
                    type: string
                status:
                    type: integer
                title:
                    type: string
                type:
                    format: uri
                    type: string
            required:
                - type
                - title
                - status
                - request_id
            type: object
        ScopeEntry:
            properties:
                effect:
                    enum:
                        - allow
                        - deny
                    type: string
                id:
                    format: uuid
                    type: string
                kind:
                    enum:
                        - domain
                        - ip
                        - cidr
                        - url_prefix
                        - service
                    type: string
                normalized_value:
                    type: string
                path_prefix:
                    type: string
                ports:
                    items:
                        type: integer
                    type: array
                value:
                    type: string
            required:
                - effect
                - kind
                - value
                - ports
            type: object
        Task:
            properties:
                budget:
                    additionalProperties: true
                    type: object
                created_at:
                    format: date-time
                    type: string
                created_by:
                    format: uuid
                    type: string
                deadline_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                description:
                    type: string
                id:
                    format: uuid
                    type: string
                organization_id:
                    format: uuid
                    type: string
                policy_mode:
                    type: string
                scope_version:
                    type: integer
                status:
                    type: string
                title:
                    type: string
                updated_at:
                    format: date-time
                    type: string
                version:
                    type: integer
                worker_limit:
                    type: integer
            required:
                - id
                - organization_id
                - title
                - status
                - version
                - scope_version
            type: object
        TaskDetail:
            properties:
                constraints:
                    items:
                        $ref: '#/components/schemas/Constraint'
                    type: array
                goals:
                    items:
                        $ref: '#/components/schemas/Goal'
                    type: array
                scope:
                    items:
                        $ref: '#/components/schemas/ScopeEntry'
                    type: array
                task:
                    $ref: '#/components/schemas/Task'
            required:
                - task
                - goals
                - constraints
                - scope
            type: object
        User:
            properties:
                created_at:
                    format: date-time
                    type: string
                email:
                    format: email
                    type: string
                id:
                    format: uuid
                    type: string
                organization_id:
                    format: uuid
                    type: string
                role:
                    enum:
                        - admin
                        - operator
                        - reviewer
                        - viewer
                    type: string
                status:
                    type: string
            required:
                - id
                - organization_id
                - email
                - role
                - status
            type: object
    securitySchemes:
        SessionCookie:
            in: cookie
            name: tianfa_session
            type: apiKey
info:
    description: 授权安全验证平台 API。当前文档覆盖 Phase 0 与 Phase 1。
    title: TianFa API
    version: 0.1.0
openapi: 3.1.0
paths:
