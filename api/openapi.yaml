                    description: 错误
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: 错误
            security:
                - SessionCookie: []
            summary: 列出组织资产
        post:
            operationId: upsertAsset
            parameters:
                - in: header
                  name: X-CSRF-Token
                  required: true
