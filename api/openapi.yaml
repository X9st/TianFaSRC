        get:
            operationId: listAssets
            parameters:
                - in: query
                  name: cursor
                  schema:
                    format: uuid
                    type: string
                - in: query
                  name: limit
                  schema:
                    default: 30
                    maximum: 100
                    minimum: 1
                    type: integer
                - in: query
                  name: kind
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        items:
                                            $ref: '#/components/schemas/Asset'
                                        type: array
                                    meta:
                                        properties:
                                            request_id:
                                                type: string
                                        required:
                                            - request_id
                                        type: object
                                required:
                                    - data
                                    - meta
                                type: object
                    description: 成功
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: 错误
                "401":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: 错误
                "403":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: 错误
                "404":
                    content:
                        application/problem+json:
                            schema:
