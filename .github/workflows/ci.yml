name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tianfa_ci
          POSTGRES_USER: tianfa
          POSTGRES_PASSWORD: tianfa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tianfa -d tianfa_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Audit production frontend dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Type-check frontend
        working-directory: web
        run: npm run typecheck
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Sync embedded frontend
        run: ./scripts/sync-web.sh
      - name: Test backend
        env:
          TIANFA_TEST_DATABASE_URL: postgres://tianfa:tianfa@localhost:5432/tianfa_ci?sslmode=disable
        run: go test ./...
      - name: Test backup archive safety
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check Go code
        run: go vet ./...
      - name: Lint GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: Audit reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Detect data races
        env:
          TIANFA_TEST_DATABASE_URL: postgres://tianfa:tianfa@localhost:5432/tianfa_ci?sslmode=disable
        run: go test -race ./...
      - name: Check OpenAPI generation
        run: go run ./cmd/openapi -check
      - name: Build server
        run: go build -trimpath ./cmd/server
      - name: Validate Compose
        run: docker compose config --quiet

